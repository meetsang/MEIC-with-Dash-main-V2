# V2 strategy registry — enable/disable without code changes.
strategies:
  - name: MEIC_IC
    enabled: true
    module: strategies.meic.strategy
    instrument: SPX
    broker: tastytrade
    stop_profile: meic_credit_spread

  - name: MANUAL_SPREAD
    enabled: true
    module: strategies.manual_spread.strategy
    instrument: SPX
    broker: tastytrade
    stop_profile: meic_credit_spread
    scheduled: false

  - name: SKYLINE_SPX
    enabled: true
    confirmed: true
    module: strategies.skyline.strategy
    instrument: SPX
    broker: tastytrade
    stop_profile: skyline_hold_to_expiry
    scheduled: false
    paper: true
    config_overrides:
      entry_time_et: '09:45'
      gap_down_skip_points: 25
      atm_rounding: 5
      quantity: 1
      entry_fill_wait_sec: 20
      entry_price_style: mid

  - name: PERMA_BULL_PCS
    enabled: true
    confirmed: true
    module: strategies.perma_bull_pcs.strategy
    instrument: SPX
    broker: tastytrade
    stop_profile: perma_bull_pcs
    scheduled: false
    paper: false
    config_overrides:
      entry_time_et: '08:45'  # US/Central (MEIC session clock)
      spread_width: 5
      target_credit: 1.0
      quantity: 1
      profit_target_debit: 0.15
